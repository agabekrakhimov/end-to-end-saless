name: CI — PySpark Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyspark==3.5.0 pytest pytest-cov scipy numpy pandas

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short --cov=notebooks --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYSPARK_PYTHON: python3

      - name: Generate sample data (smoke test)
        run: |
          python data/generate_sample_data.py --rows 1000 --out /tmp/sample_data
          echo "Sample files:"
          ls -lh /tmp/sample_data/
